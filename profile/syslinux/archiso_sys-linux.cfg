LABEL arch
TEXT HELP
Boot the X Full Installer on BIOS.
It allows you to install X Linux or perform system maintenance.
ENDTEXT
MENU LABEL X Full Installer (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% edd=off systemd.firstboot=0


LABEL xauto
TEXT HELP
Unattended install. Requires xauto=1 (already set here) and a disk labeled
cidata containing x-install.json. See the installer documentation.
ENDTEXT
MENU LABEL X Linux ^autoinstall (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% edd=off systemd.firstboot=0 xauto=1 xfull.no_tui=1 console=ttyS0

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the X Full Installer on BIOS with speakup screen reader.
It allows you to install X Linux or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL X Full Installer (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% edd=off systemd.firstboot=0 accessibility=on
